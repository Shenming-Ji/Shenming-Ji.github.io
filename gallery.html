<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shenming's Plog</title>
    <meta name="description" content="A curated photography plog by Simon Ji, featuring natural light, after dark, and gear notes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f6f4;
            --bg-soft: #efefec;
            --surface: rgba(255, 255, 255, 0.82);
            --surface-strong: rgba(255, 255, 255, 0.98);
            --line: rgba(43, 34, 25, 0.12);
            --line-strong: rgba(43, 34, 25, 0.2);
            --text: #201a15;
            --muted: #6d6156;
            --accent: #8a8178;
            --accent-soft: #ddd8d1;
            --shadow: 0 24px 60px rgba(55, 39, 22, 0.08);
            --serif: "Cormorant Garamond", Georgia, serif;
            --sans: "Manrope", "Segoe UI", sans-serif;
            --radius-xl: 30px;
            --radius-lg: 24px;
            --radius-md: 18px;
            --radius-sm: 999px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: var(--sans);
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.72), transparent 30%),
                radial-gradient(circle at bottom right, rgba(232, 232, 228, 0.42), transparent 30%),
                linear-gradient(180deg, #fbfbfa 0%, var(--bg) 56%, #f1f1ee 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.18) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.16), transparent 72%);
            opacity: 0.28;
        }

        a {
            color: inherit;
        }

        .page-shell {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px 24px 40px;
            display: grid;
            grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
            column-gap: 42px;
            position: relative;
            transition: grid-template-columns 0.3s ease, column-gap 0.3s ease;
        }

        .page-shell.sidebar-collapsed {
            grid-template-columns: 0 minmax(0, 1fr);
            column-gap: 0;
        }

        .sidebar {
            position: sticky;
            top: 112px;
            align-self: start;
            width: 320px;
            margin-top: 88px;
            min-width: 0;
            transition: transform 0.3s ease, opacity 0.3s ease, visibility 0s;
        }

        .sidebar-collapsed .sidebar {
            transform: translateX(calc(-100% - 30px));
            opacity: 0;
            visibility: hidden;
            transition: transform 0.3s ease, opacity 0.3s ease, visibility 0s 0.3s;
        }

        .sidebar-toggle {
            z-index: 10;
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: var(--surface-strong);
            color: var(--muted);
            box-shadow: 0 5px 18px rgba(55, 39, 22, 0.08);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .sidebar-toggle:hover { background: #fff; transform: scale(1.06); }
        .sidebar-toggle[hidden] { display: none; }
        .sidebar-toggle:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        .sidebar-toggle svg { width: 16px; height: 16px; transition: transform 0.3s ease; }

        .sidebar-reopen {
            position: fixed;
            top: 20px;
            left: 12px;
            right: auto;
            visibility: hidden;
            opacity: 0;
        }

        .sidebar-collapsed .sidebar-reopen { visibility: visible; opacity: 1; }
        .sidebar-reopen svg { transform: rotate(180deg); }

        .sidebar-reopen:hover { transform: scale(1.06); }

        .content {
            min-width: 0;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: var(--radius-xl);
        }

        .sidebar-card {
            padding: 24px;
        }

        .home-link {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(43, 34, 25, 0.08);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.52);
            font-size: 17px;
            font-weight: 500;
            text-decoration: none;
            color: var(--muted);
            margin-bottom: 18px;
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .home-link:hover,
        .home-link:focus-visible {
            color: #4e2a84;
            border-color: rgba(78, 42, 132, 0.3);
            background: rgba(78, 42, 132, 0.035);
        }

        .filter-block {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(43, 34, 25, 0.09);
        }

        .filter-heading {
            margin: 0 0 14px;
            font-size: 0.78rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .filter-list {
            display: grid;
            gap: 8px;
        }

        .tag-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 18px;
            text-decoration: none;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.46);
            color: var(--text);
            transition: transform 0.24s ease, background 0.24s ease, border-color 0.24s ease, color 0.24s ease;
        }

        .tag-link:hover {
            transform: translateY(-1px);
            border-color: rgba(43, 34, 25, 0.14);
            background: rgba(255, 255, 255, 0.72);
        }

        .tag-link.active {
            background: var(--text);
            color: #fff;
        }

        .tag-link.active .tag-count {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }

        .tag-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .tag-label svg {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            opacity: 0.8;
        }

        .tag-count {
            min-width: 32px;
            padding: 5px 9px;
            border-radius: var(--radius-sm);
            background: rgba(32, 26, 21, 0.08);
            color: var(--muted);
            text-align: center;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .sidebar-footer {
            margin-top: 18px;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.5;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .sidebar-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
        }

        .content {
            display: grid;
            gap: 24px;
            width: 100%;
            max-width: 900px;
            margin-inline: auto;
            transition: max-width 0.3s ease;
        }

        .sidebar-collapsed .content { max-width: 1200px; }

        .gallery {
            column-count: 2;
            column-gap: 24px;
        }

        .sidebar-collapsed .gallery:not(.gear-mode) { column-count: 3; }

        .gallery.gear-mode {
            column-count: 1;
            column-gap: 0;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 22px;
            opacity: 0;
            animation: fadeUp 0.65s ease forwards;
        }

        .gallery-link {
            display: block;
            text-decoration: none;
            background: var(--surface-strong);
            border: 1px solid rgba(43, 34, 25, 0.09);
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 18px 48px rgba(55, 39, 22, 0.06);
            transition: transform 0.26s ease, box-shadow 0.26s ease, border-color 0.26s ease;
        }

        .gallery-link:hover {
            transform: translateY(-5px);
            border-color: rgba(43, 34, 25, 0.15);
            box-shadow: 0 24px 54px rgba(55, 39, 22, 0.1);
        }

        .gallery-image-wrap {
            overflow: hidden;
            border-radius: 18px;
            background: #ecebe8;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.55s ease;
        }

        .gallery-link:hover img {
            transform: scale(1.035);
        }

        .caption {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 4px 4px;
        }

        .caption-title {
            font-family: var(--serif);
            font-size: 1.38rem;
            line-height: 1.05;
            font-weight: 600;
        }

        .caption-tag {
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            flex: 0 0 auto;
            opacity: 0.7;
        }

        .caption-tag svg {
            width: 15px;
            height: 15px;
        }

        .equipment-view,
        .empty-state {
            background: var(--surface-strong);
            border: 1px solid rgba(43, 34, 25, 0.09);
            border-radius: 30px;
            padding: 28px;
            box-shadow: 0 18px 48px rgba(55, 39, 22, 0.06);
            animation: fadeUp 0.7s ease both;
        }

        .equipment-view {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(240px, 0.85fr);
            gap: 28px;
            align-items: center;
        }

        .equipment-copy span {
            display: inline-block;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 0.76rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .equipment-copy h2 {
            margin: 0 0 10px;
            font-family: var(--serif);
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 0.98;
            font-weight: 600;
        }

        .equipment-specs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .equipment-specs div {
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            background: rgba(32, 26, 21, 0.06);
            color: var(--text);
            font-size: 0.83rem;
            font-weight: 600;
        }

        .equipment-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .equipment-image img {
            display: block;
            width: min(100%, 340px);
            height: auto;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
        }

        .empty-state strong {
            display: block;
            color: var(--text);
            font-family: var(--serif);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: rgba(18, 13, 10, 0.86);
            z-index: 9999;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-figure {
            position: relative;
            margin: 0;
            max-width: min(92vw, 1240px);
            max-height: 88vh;
            display: grid;
            gap: 14px;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: calc(88vh - 72px);
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
        }

        .lightbox-caption {
            color: rgba(255, 255, 255, 0.82);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.95rem;
        }

        .lightbox-caption strong {
            font-family: var(--serif);
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
        }

        .lightbox-close {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1100px) {
            .page-shell {
                grid-template-columns: minmax(240px, 290px) minmax(0, 1fr);
            }

            .page-shell.sidebar-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
            .sidebar { width: 290px; }
            .sidebar-collapsed .gallery:not(.gear-mode) { column-count: 2; }
        }

        @media (max-width: 860px) {
            .page-shell {
                grid-template-columns: 1fr;
                column-gap: 0;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 20;
                width: min(320px, calc(100vw - 48px));
                height: 100dvh;
                padding: 70px 12px 20px;
                margin-top: 0;
                overflow-y: auto;
                background: var(--bg);
                box-shadow: 12px 0 35px rgba(55, 39, 22, 0.12);
            }

            .sidebar-collapsed .sidebar { transform: translateX(-100%); }
            .page-shell.sidebar-collapsed { grid-template-columns: 1fr; }
            .sidebar-reopen {
                position: fixed;
                top: 20px;
                left: 12px;
                right: auto;
                z-index: 30;
            }

            .gallery {
                column-count: 2;
            }

            .equipment-view {
                grid-template-columns: 1fr;
                gap: 18px;
            }
        }

        @media (max-width: 640px) {
            .page-shell {
                padding: 18px 16px 30px;
                gap: 18px;
            }

            .sidebar-card,
            .equipment-view,
            .empty-state {
                padding: 22px;
                border-radius: 24px;
            }

            .lightbox-caption {
                align-items: flex-start;
                flex-direction: column;
            }

            .gallery {
                column-count: 1;
                column-gap: 0;
            }

            .sidebar-collapsed .gallery:not(.gear-mode) { column-count: 1; }

            .caption {
                flex-direction: column;
                align-items: flex-start;
            }

            .lightbox {
                padding: 18px;
            }

            .lightbox-close {
                top: 10px;
                right: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .page-shell, .sidebar, .sidebar-collapsed .sidebar, .content, .sidebar-toggle, .sidebar-toggle svg,
            .gallery-item, .equipment-view, .empty-state { transition: none; animation: none; }
            .gallery-item { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="page-shell" id="pageShell">
        <aside class="sidebar" id="sidebar">
            <div class="panel sidebar-card">
                <a class="home-link" href="index.html"><span aria-hidden="true">←</span>Shenming's Website</a>
                <div class="filter-block">
                    <p class="filter-heading">Browse</p>
                    <div class="filter-list">
                        <a class="tag-link active" data-filter="all" href="?filter=all">
                            <span class="tag-label">All Frames</span>
                            <span class="tag-count" data-count-for="all">0</span>
                        </a>
                        <a class="tag-link" data-filter="day" href="?filter=day">
                            <span class="tag-label">Natural Light</span>
                            <span class="tag-count" data-count-for="day">0</span>
                        </a>
                        <a class="tag-link" data-filter="night" href="?filter=night">
                            <span class="tag-label">After Dark</span>
                            <span class="tag-count" data-count-for="night">0</span>
                        </a>
                        <a class="tag-link" data-filter="gear" href="?filter=gear">
                            <span class="tag-label">Gear Notes</span>
                            <span class="tag-count" data-count-for="gear">1</span>
                        </a>
                    </div>
                </div>

                <p class="sidebar-footer">© 2026, Shenming Ji</p>
                <div class="sidebar-actions">
                    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Collapse sidebar" aria-controls="sidebar" aria-expanded="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                </div>
            </div>
        </aside>
        <button class="sidebar-toggle sidebar-reopen" id="sidebarReopen" type="button" aria-label="Expand sidebar" aria-controls="sidebar" aria-expanded="false" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <main class="content">
            <section class="gallery" id="gallery" aria-live="polite"></section>
        </main>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Photo viewer">
        <figure class="lightbox-figure">
            <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close viewer">&times;</button>
            <img class="lightbox-image" id="lightboxImage" src="" alt="">
            <figcaption class="lightbox-caption">
                <strong id="lightboxTitle"></strong>
                <span id="lightboxTag"></span>
            </figcaption>
        </figure>
    </div>

    <script src="assets/js/plog-data.js"></script>
    <script>
        const { photos, filterLabels } = window.PlogData;

        const categoryIconPaths = {
            all: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
            day: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',
            night: '<path d="M20.3 15.6A8.5 8.5 0 0 1 8.4 3.7 8.5 8.5 0 1 0 20.3 15.6Z"/>',
            gear: '<path d="M4 7h3l1.5-2h7L17 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/>'
        };

        function getCategoryIcon(tag) {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${categoryIconPaths[tag] || categoryIconPaths.all}</svg>`;
        }

        document.querySelectorAll('.tag-link').forEach((link) => {
            link.querySelector('.tag-label').insertAdjacentHTML('afterbegin', getCategoryIcon(link.dataset.filter));
        });

        const photosReversed = photos.slice().reverse();
        let activeFilter = "all";

        const gallery = document.getElementById("gallery");
        const pageShell = document.getElementById("pageShell");
        const sidebar = document.getElementById("sidebar");
        const sidebarToggle = document.getElementById("sidebarToggle");
        const sidebarReopen = document.getElementById("sidebarReopen");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const lightboxTitle = document.getElementById("lightboxTitle");
        const lightboxTag = document.getElementById("lightboxTag");
        const lightboxClose = document.getElementById("lightboxClose");

        function getFilteredPhotos() {
            if (activeFilter === "all") return photosReversed.slice();
            if (activeFilter === "gear") return [];
            return photosReversed.filter((photo) => (photo.tags || "").split(/\s+/).includes(activeFilter));
        }

        function getTagLabel(tag) {
            return filterLabels[tag] || "Collection";
        }

        function updateFilterCounts() {
            const counts = {
                all: photosReversed.length,
                day: photosReversed.filter((photo) => (photo.tags || "").includes("day")).length,
                night: photosReversed.filter((photo) => (photo.tags || "").includes("night")).length,
                gear: 1
            };

            document.querySelectorAll("[data-count-for]").forEach((node) => {
                const key = node.getAttribute("data-count-for");
                node.textContent = counts[key];
            });
        }

        function updateTagLinksUI() {
            document.querySelectorAll(".tag-link").forEach((link) => {
                const isActive = link.getAttribute("data-filter") === activeFilter;
                link.classList.toggle("active", isActive);
                link.setAttribute("aria-current", isActive ? "page" : "false");
            });
        }

        function renderEquipmentView() {
            gallery.innerHTML = `
                <article class="equipment-view">
                    <div class="equipment-copy">
                        <span>Current Setup</span>
                        <h2>Nikon Z30</h2>
                        <div class="equipment-specs">
                            <div>16-50mm kit lens</div>
                            <div>Viltrox 56mm f/1.7</div>
                        </div>
                    </div>
                    <div class="equipment-image">
                        <img src="images/NikonZ30.png" alt="Nikon Z30 camera setup">
                    </div>
                </article>
            `;
        }

        function renderEmptyState() {
            gallery.innerHTML = `
                <article class="empty-state">
                    <strong>No frames here yet.</strong>
                    <span>Try another filter and the gallery will update right away.</span>
                </article>
            `;
        }

        function renderGallery() {
            gallery.innerHTML = "";

            if (activeFilter === "gear") {
                gallery.classList.add("gear-mode");
                renderEquipmentView();
                return;
            }

            gallery.classList.remove("gear-mode");

            const source = getFilteredPhotos();

            if (source.length === 0) {
                renderEmptyState();
                return;
            }

            source.forEach((photo, index) => {
                const item = document.createElement("article");
                item.className = "gallery-item";
                item.style.animationDelay = Math.min(index * 45, 360) + "ms";
                item.innerHTML = `
                    <a class="gallery-link" href="${photo.img}" data-lightbox="true" data-title="${photo.caption}" data-tag="${getTagLabel(photo.tags)}">
                        <div class="gallery-image-wrap">
                            <img src="${photo.img}" alt="${photo.caption}" loading="lazy">
                        </div>
                        <div class="caption">
                            <span class="caption-title">${photo.caption}</span>
                            <span class="caption-tag" role="img" aria-label="${getTagLabel(photo.tags)}" title="${getTagLabel(photo.tags)}">${getCategoryIcon(photo.tags)}</span>
                        </div>
                    </a>
                `;
                gallery.appendChild(item);
            });
        }

        function openLightbox(src, title, tag) {
            lightboxImage.src = src;
            lightboxImage.alt = title;
            lightboxTitle.textContent = title;
            lightboxTag.textContent = tag;
            lightbox.classList.add("active");
            lightbox.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lightbox.classList.remove("active");
            lightbox.setAttribute("aria-hidden", "true");
            lightboxImage.src = "";
            lightboxImage.alt = "";
            document.body.style.overflow = "";
        }

        function applyFilter(filter) {
            activeFilter = filterLabels[filter] ? filter : "all";

            const url = new URL(window.location.href);
            url.searchParams.set("filter", activeFilter);
            history.pushState({}, "", url);

            updateTagLinksUI();
            renderGallery();
        }

        function setSidebarCollapsed(collapsed) {
            pageShell.classList.toggle("sidebar-collapsed", collapsed);
            sidebar.inert = collapsed;
            sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
            sidebarReopen.hidden = !collapsed;
            sidebarReopen.setAttribute("aria-expanded", String(!collapsed));
        }

        sidebarToggle.addEventListener("click", () => {
            setSidebarCollapsed(true);
        });
        sidebarReopen.addEventListener("click", () => setSidebarCollapsed(false));

        setSidebarCollapsed(window.matchMedia("(max-width: 860px)").matches);

        document.querySelectorAll(".tag-link").forEach((link) => {
            link.addEventListener("click", (event) => {
                event.preventDefault();
                const filter = link.getAttribute("data-filter");
                applyFilter(filter);
            });
        });

        gallery.addEventListener("click", (event) => {
            const link = event.target.closest("[data-lightbox='true']");
            if (!link) return;
            if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

            event.preventDefault();
            openLightbox(
                link.getAttribute("href"),
                link.getAttribute("data-title") || "",
                link.getAttribute("data-tag") || ""
            );
        });

        lightboxClose.addEventListener("click", closeLightbox);
        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        window.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && lightbox.classList.contains("active")) {
                closeLightbox();
            }
        });

        window.addEventListener("popstate", () => {
            const filterFromUrl = new URLSearchParams(window.location.search).get("filter") || "all";
            activeFilter = filterLabels[filterFromUrl] ? filterFromUrl : "all";
            updateTagLinksUI();
            renderGallery();
        });

        const initialFilter = new URLSearchParams(window.location.search).get("filter");
        if (initialFilter && filterLabels[initialFilter]) {
            activeFilter = initialFilter;
        }

        updateFilterCounts();
        updateTagLinksUI();
        renderGallery();
    </script>
</body>
</html>
